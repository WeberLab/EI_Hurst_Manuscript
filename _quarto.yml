project:
  type: manuscript
  render: 
    - "!notes.md"
    - "*.qmd"
  #   - "!pyvenv_csvo/"
    - "*.ipynb"

manuscript:
  article: index.qmd

code-links:
  - repo
  - binder

execute:
  freeze: auto
  cache: false

format:
  html:
    embed-resources: true
    notebook-links: true
    toc: true
    comments:
      hypothesis: true
  docx:
    reference-doc: custom-reference.docx
    line-numbers: false
  # jats: default
  # pdf:
  #   colorlinks: true
  #   keep-tex: true
  nature-pdf:
    # include-in-header:
    #   - text: |
    #       \usepackage{breqn}
    journal: 
      cite-style: sn-nature
      keep-tex: true
      colorlinks: true
      link-citations: true
      pdf-engine: xelatex
  #   cite-method: natbib

filters:
  - parse-latex
